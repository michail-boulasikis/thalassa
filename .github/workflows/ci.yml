name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests examples benchmarks
      - name: Mypy
        run: mypy
      - name: Tests and coverage
        run: >-
          pytest
          --cov=thalassa.compiler
          --cov=thalassa.runtime
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --no-deps --force-reinstall dist/thalassa-2.0.0-py3-none-any.whl
          cd /tmp
          python -c 'import thalassa; assert thalassa.__version__ == "2.0.0"'
