[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thalassa"
version = "2.0.0"
description = "Typed finite-difference PDE compiler and PyTorch runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Boulasikis Michail"}]
dependencies = [
  "sympy>=1.12",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "mypy>=1.10",
  "numpy>=1.26",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]
viz = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]
tpu = [
  "torch==2.8.0",
  "torch-xla[tpu]==2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["thalassa"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
branch = false
source = ["thalassa.compiler", "thalassa.runtime"]

[tool.coverage.report]
fail_under = 90
show_missing = true
